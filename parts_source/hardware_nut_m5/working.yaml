    description: Hexagon Nuts are one of the most popular types of fasteners, designed
      to be used in conjunction with screws, bolts and other male threaded fasteners
      to securely join multiple components together. When combined with a Mating Bolt,
      a hex nut can be used to fasten two or more parts together through a combination
      of compression, friction (of the threads of the fasteners), and a slight stretching
      of the bolt. Washers are also often used with nuts and bolts to help distribute
      the load of the fasteners, for spacing or protecting the surfaces of the mating
      components. This type of metric nut is also commonly referred to as a Full Nut
      or Finished Hex Nut, and is typically fastened using either a wrench (spanner)
      or a ratchet. For heavy duty applications, such as structural projects, Heavy
      Duty Hex Nuts are available from Accu in both metric and imperial sizes. Metric
      Hex Nut Materials Hexagon Nuts from Accu are manufactured in a wide range of
      materials. Metal Hex Nuts available include A1, A2, A4 Stainless Steel, with
      High Tensile options in Duplex and Bumax Stainless Steel. Mild Steel (Grades
      6, 8, 10 and 12) is also available with either Hot Dip Galvanised or Zinc Plated
      finishes. Accu also lists Plastic Hex Nuts in our standard range, with Nylon,
      Polycarbonate, Polypropylene, Reny and Polyphenylene options available, along
      with specialist thermoplastics like PVDF and PEEK. Additionally, exotic materials
      such as ceramic and aluminium are also available. Hexagon Nuts can be manufactured
      in alternative material types such as Brass, Phosphor Bronze and Titanium on
      request. Metric Hexagon Nuts Accu's Hex Nuts are manufactured according to internationally
      recognised industry standards, with DIN 934 and ISO 4032 options available.
      As standard, we stock Full Nuts in metric sizes from M1 to M56. These components
      feature a coarse metric thread pitch, which makes them more resistant to cross
      threading and stripping. Metric Fine Pitch Hexagon Nuts are available from our
      online store for applications which require finer adjustments and greater resistance
      to loosening under vibration. Imperial Hexagon Nuts Imperial Hexagon Nuts are
      also supplied by Accu in diameters ranging from No. 0 up to 2 inch. Both UNC
      and UNF threads are available.
