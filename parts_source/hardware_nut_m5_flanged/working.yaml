    description: Often simply referred to as a Washer Nut or a Flange Nut, Metric
      Flanged Hexagon Nuts are used in place of a regular Hexagon Nut and a Flat Washer.
      The flange of this nut is essentially an integrated washer, which helps with
      load distribution and can negate the need for using a separate washer. This
      makes Washer Nuts ideal for applications where space is limited. Metric Serrated
      Flange Nuts are also available from Accu, which feature a flange with a serrated
      underside, designed to bite into the mating surface to provide additional grip
      and resistance to vibrations. Materials Accu’s Stainless Steel Flange Nuts are
      manufactured in both A2 and A4 Stainless Steel, in either a natural or Matte
      Black finish. Plastic Flange Nuts in this range are available in natural finish
      (White) Nylon and Polyamide. M5, M6 and M8 Flange Nuts are also available in
      Zinc Plated 8.8 Hardened Steel. Metric Flanged Hex Nuts Metric Flange Nuts are
      available from Accu in thread sizes M3 up to M32, with Flange Diameters ranging
      from 7mm to 27mm. Imperial Flanged Hex Nuts For imperial sizes, please see Accu’s
      Imperial Serrated Flange Nut range.
