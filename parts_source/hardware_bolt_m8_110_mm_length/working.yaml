    description: Plain Hexagon Bolts feature a standard hexagonal head, and are ideal
      for heavy-duty fastening applications. All components within this range are
      precision rolled to achieve general tolerances of +/-0.13mm. Plain Hexagon Bolts
      are designed for use alongside Accu’s Hexagon Nuts ranges. As Hexagon Bolts
      are generally used with unthreaded holes, Plain Hexagon Bolts feature an unthreaded
      shank below the Bolt's head. The absence of a thread on this section of the
      Bolt results in a stronger, more uniform shaft, making the entire fastening
      more resistant to vibration and shear forces when the unthreaded portion is
      inserted into a correctly sized hole. In these applications, Hexagon Bolts function
      similarly to a Dowel. The minimum thread length of each Bolt is defined on each
      individual product page. Fully Threaded Hexagon Bolts are also available. Materials
      Components within this range are available in a wide range of materials, including
      A2, A4 and A4-80 Stainless Steel, BUMAX, Brass, Phosphor Bronze, Nylon (Polyamide),
      and PEEK. Ensure your Metric Plain Hexagon Bolts stay secure with our advanced
      pre-applied thread-locking patches. Whether you need AccuLock Threadlocker for
      essential fastening, Anu-Lok 180 for added grip, or Precote 80 for maximum performance,
      we have the right solution. For a refined aesthetic, AccuBlack chemical blackening
      reduces glare while enhancing the surface finish. Metric Metric Plain Hexagon
      Bolts manufactured according to DIN 931, and are available in diameters ranging
      from M5 up to M52. Lengths of between 20mm and 600mm are also available as standard.
      Non-Standard sizes are available on request. Imperial Imperial Plain Hexagon
      Bolts are available in thread diameters ranging from ¼ inch up to No.12, and
      lengths of between 1/4 inch and 12 inch. These components are manufactured to
      ANSI B18.2.1. Additional sizes are also available on request.
    html_sha256: 69d5b47c6878d8c77999dce7fca2af5146a309fd3f9f7ef16a26aeb1f897a4ae
