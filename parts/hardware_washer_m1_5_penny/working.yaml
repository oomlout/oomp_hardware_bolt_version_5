    thread: Nominal ISO basic metric profile, no ISO 965 tolerance offsets. External
      rounded root H/6, internal P/4 crest and P/8 root flats.
    runout: External one-pitch fade to plain shank; full thread ends at underhead
      fillet.
    chamfer: 30 degree outer hex chamfer. Nut mouth included angle 120 degrees. Bolt
      tip 45 degrees, P/2.
    bearing: Bolt bearing circle and c selected within limits; k includes bearing
      thickness; fillet tangent to shaft and bearing.
    cavity: Nut through-bore has a helical internal surface; display keeps minor-diameter
      bore and mouth chamfers.
    display: Smooth nominal external-thread envelope or smooth minor-diameter internal
      bore; lower angular and fillet tessellation.
    components: One closed solid.
    markings: Supplier and property-class markings omitted because catalogue does
      not identify them.
    unspecified_geometry: Nut mouth for supplier rows without limits and flange M3/M4
      thickness/rim blends are explicit visual model selections.
    family_note: Visual large-washer selection informed by Westfield M2/M2.5 proportions.
      Bore clears literal catalogue size; exact supplier availability unverified.
    certification: Nominal visual catalogue model, not manufacturing tolerance certification.
